<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="{pageBase}" />
    <title>{title}</title>
    <meta name="description" content="{description}" />
    <meta property="og:description" content="{description}" />
    <meta property="og:image" content="{og-image}" />
    <meta property="og:title" content="{title}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{og-url}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Plus+Jakarta+Sans:wght@700&display=swap"
    />
    <link rel="stylesheet" href="{base}minterface.css" />
    <link rel="stylesheet" href="{base}global.css" />
    {styles}
    <script crossorigin="anonymous" defer src="https://kit.fontawesome.com/46660cdeff.js"></script>
    <script defer src="https://unpkg.com/scrollreveal@4.0.7"></script>
    <script defer src="{base}global.js"></script>
    {scripts}
  </head>
  <body>
    <header class="layer">
      <div class="layer-inset">
        <a class="logo" href="/">
          <img alt="Pastor.tools" class="logo-img" src="{base}assets/pastor.tools.png" />
          <span class="logo-text">Pastor<span class="muted">.tools</span></span>
        </a>
        <a class="button button-primary" href="/app">Get started for free</a>
      </div>
    </header>
    {content}
    <footer class="layer">
      <div class="layer-inset">
        <svg id="footer-logo" viewBox="0 0 800 120" preserveAspectRatio="xMidYMid meet">
          <text x="400" y="112" text-anchor="middle">Pastor.tools</text>
        </svg>
      </div>
    </footer>
  </body>
</html>
